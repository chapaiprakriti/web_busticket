services:
  - name: seat-sathi-web
    type: web
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://bus-ticketing-ouxm.onrender.com
      - key: NEXT_PUBLIC_KHALTI_PUBLIC_KEY
        value: your_khalti_public_key_here
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://your-app.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
    plan: starter
    disk:
      size: 1
      mountPath: /tmp
    repo: https://github.com/your-repo/seat-sathi-booking